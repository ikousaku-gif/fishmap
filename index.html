<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>松山沖 釣りマップ</title>
<meta name="theme-color" content="#0f2a3d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 全画面の地図 + 下からの引き出し (ﾎﾟｲﾝﾄ/潮/記録/設定) */
:root{
  --glass:rgba(255,255,255,.45);
  --bg:#f3f6f8; --panel:#ffffff; --fg:#13222e; --sub:#5b6b78; --line:#d6dee5;
  --sea:#0f2a3d; --accent:#e8661c; --accent-fg:#ffffff; --ok:#1d8a4e; --hi:#2b6cb0; --lo:#b7791f;
  --font:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --glass:rgba(19,35,49,.5); --bg:#0b1620; --panel:#132331; --fg:#e4edf3; --sub:#93a6b5; --line:#24394b;
    --sea:#081520; --accent:#ff8a3d; --accent-fg:#1a0d04; --ok:#4cc38a; --hi:#6aa9ec; --lo:#e2b15a; color-scheme:dark }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);overflow:hidden}
#map{position:fixed;inset:0;z-index:1;background:#aac8dd}
.top{position:fixed;z-index:500;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.top > *{pointer-events:auto}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gps{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.gps b{color:var(--fg)}
.navbox{position:fixed;z-index:500;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 52px);background:var(--sea);color:#fff;border-radius:12px;padding:6px 14px;font-size:15px;display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.navbox{white-space:nowrap;max-width:calc(100% - 24px)}
.navbox > span:first-child{overflow:hidden;text-overflow:ellipsis;max-width:7em;font-size:13px}
.navbox .big{font-size:22px;font-weight:700}
.navbox button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;font:inherit;font-size:13px;padding:2px 8px}
.fab{position:fixed;z-index:500;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;bottom:calc(var(--sheet-h,56px) + 12px)}
.fab button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,.2);cursor:pointer}
.fab button.on{background:var(--accent);color:var(--accent-fg)}
.sheet{position:fixed;z-index:600;left:0;right:0;bottom:0;background:var(--glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.15);padding-bottom:env(safe-area-inset-bottom,0px);display:flex;flex-direction:column;max-height:52vh}
.sheet.tall{max-height:72vh;background:var(--panel)}
body.tallsheet .fab{display:none}
/* 地図の見えている所の真ん中に出す十字 (下の画面の分を引いた真ん中) */
.cross{position:fixed;z-index:450;left:50%;top:calc((100% - var(--sheet-h,56px)) / 2);width:34px;height:34px;transform:translate(-50%,-50%);pointer-events:none}
.cross::before,.cross::after{content:"";position:absolute;background:#d4145a;box-shadow:0 0 0 1.5px #fff}
.cross::before{left:16px;top:0;width:2px;height:34px}
.cross::after{top:16px;left:0;height:2px;width:34px}
body.tallsheet .cross{display:none}
.grab{display:flex;justify-content:center;align-items:center;gap:8px;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;padding:6px 0 0;cursor:pointer;width:100%}
.grab::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 max(8px,env(safe-area-inset-left,0px))}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--sub);font:inherit;font-weight:700;padding:12px 4px 9px;cursor:pointer}
.tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.body{overflow:auto;padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.sheet.closed .body{display:none}
h3{margin:4px 0 8px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{display:flex;flex-direction:column;gap:0}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item .nm{font-weight:700}
.item .meta{color:var(--sub);font-size:13px}
.item .dist{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap;text-align:right}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.btn.warn{color:#c53030}
label{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--sub);flex:1;min-width:120px}
input,textarea,select{font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{min-height:60px}
.form{display:flex;flex-direction:column;gap:10px}
.note{font-size:12px;color:var(--sub)}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;margin:2px 4px 0 0}
.tidehead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tidename{font-weight:700;font-size:18px}
.tev{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;font-variant-numeric:tabular-nums;font-size:14px}
.tev div{background:var(--bg);border-radius:8px;padding:6px;text-align:center}
.tev .k{font-size:11px;color:var(--sub)}
svg text{fill:var(--sub);font-size:10px}
.warnbar{font-size:12px;color:var(--sub);border-top:1px dashed var(--line);margin-top:12px;padding-top:8px}
.pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.dim{background:#8a99a6;opacity:.7}
.pin.hit{animation:flash 1s infinite}
.pin.sel{background:#d53f8c}
.pin.other{background:#7c3aed}
@keyframes flash{50%{box-shadow:0 0 0 10px rgba(232,102,28,.35)}}
@media (prefers-reduced-motion: reduce){.pin.hit{animation:none;box-shadow:0 0 0 5px rgba(232,102,28,.5)}}
.me{width:18px;height:18px;border-radius:50%;background:#2b6cb0;border:3px solid #fff;box-shadow:0 0 0 2px rgba(43,108,176,.4)}
.toast{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,56px) + 70px);background:var(--sea);color:#fff;padding:8px 14px;border-radius:10px;font-size:14px}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div id="map"></div>

<div class="top">
  <div class="gps" id="gps">GPS: 待機中</div>
  <div style="flex:1;pointer-events:none"></div>
  <button class="chip" id="fishBtn" title="押すと魚で探す">🐟 よくちん釣行Data</button>
</div>
<div class="navbox" id="navbox" hidden></div>
<div class="cross" id="cross" aria-hidden="true"></div>

<div class="fab">
  <button id="depthBtn" title="等深線の表示">〰</button>
  <button id="layerBtn" title="地図の種類">🗺</button>
  <button id="followBtn" title="現在地を追う">◎</button>
  <button id="addHereBtn" title="今の場所をﾎﾟｲﾝﾄに">＋</button>
</div>

<div class="sheet" id="sheet">
  <button class="grab" id="grab" type="button">閉じる</button>
  <div class="tabs" id="tabs">
    <button data-t="points" class="on">ﾎﾟｲﾝﾄ</button>
    <button data-t="tide">潮</button>
    <button data-t="log">釣果</button>
    <button data-t="trips">出港</button>
    <button data-t="boat">船</button>
    <button data-t="data">ﾃﾞｰﾀ</button>
  </div>
  <div class="body" id="body"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
/* ---------- 保存 (この端末の中だけ) ---------- */
const KEY = "matsuyama_fishmap_v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("保存できませんでした"); } if(typeof scheduleSync==="function") scheduleSync(); }
let S = load() || { points:[], logs:[], view:[33.87,132.62,11], layer:0 };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

/* ---------- 地図 ---------- */
const GSI = '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院ﾀｲﾙ</a>';
const LAYERS = [
  ["淡色", L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{maxZoom:18,attribution:GSI})],
  ["写真", L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg",{maxZoom:18,attribution:GSI})],
  ["標準", L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",{maxZoom:18,attribution:GSI})],
];
const APP_VER="2026-11-22t";
// 地図は 中国・四国の西のあたりから外へ出ないようにする (指で流しすぎて迷子にならないように)
const map = L.map("map",{zoomControl:false,minZoom:8,maxBounds:[[32.3,130.6],[35.3,134.8]],maxBoundsViscosity:1.0}).setView([S.view[0],S.view[1]],S.view[2]);
let curLayer = LAYERS[S.layer||0][1].addTo(map);
/* 等深線: 国土地理院 沿岸海域土地条件図 (ﾀｲﾙは z14〜16 だけ・松山沖の一部だけ) */
const DEPTH = L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/ccm2/{z}/{x}/{y}.png",{
  minZoom:12, maxZoom:18, minNativeZoom:14, maxNativeZoom:16, opacity:0.75, zIndex:5,
  bounds:[[33.5,131.9],[34.6,134.5]],
  attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">沿岸海域土地条件図 (国土地理院)</a>'});
/* 等深線 (広域): NOAA ETOPO 2022 (約 450m 格子) から作った線。上の詳しい図が無い所だけ */
const DEPTH2 = L.geoJSON(null,{
  style:f=>({color:"#1f5f99",weight:f.properties.d%50===0?1.8:1,opacity:.75}),
  onEachFeature:(f,l)=>l.bindTooltip(f.properties.d+" m",{sticky:true}),
  attribution:'等深線 (広域): ETOPO 2022 (NOAA)'});
fetch("contours_etopo.json").then(r=>r.json()).then(j=>DEPTH2.addData(j)).catch(()=>{});
const DEPTH_GROUP = L.layerGroup([DEPTH,DEPTH2]);
if(S.depth!==false) DEPTH_GROUP.addTo(map);
function depthHint(){}
L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);
map.on("moveend",()=>{ const c=map.getCenter(); S.view=[+c.lat.toFixed(5),+c.lng.toFixed(5),map.getZoom()]; save(); });
document.getElementById("layerBtn").onclick=()=>{
  map.removeLayer(curLayer); S.layer=((S.layer||0)+1)%LAYERS.length; curLayer=LAYERS[S.layer][1].addTo(map); save(); toast("地図: "+LAYERS[S.layer][0]);
};
const depthBtn=document.getElementById("depthBtn");
depthBtn.classList.toggle("on",S.depth!==false);
depthBtn.onclick=()=>{
  if(S.depth!==false){ S.depth=false; map.removeLayer(DEPTH_GROUP); toast("等深線を消しました"); }
  else { S.depth=true; DEPTH_GROUP.addTo(map); toast("等深線を出しました"); }
  depthBtn.classList.toggle("on",S.depth!==false); save();
};
map.on("contextmenu",e=>{ openPointForm(null,e.latlng.lat,e.latlng.lng); });

/* ---------- 距離・方位 ---------- */
function distM(a,b,c,d){ const R=6371000,t=Math.PI/180; const x=Math.sin((c-a)*t/2)**2+Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function bearing(a,b,c,d){ const t=Math.PI/180; const y=Math.sin((d-b)*t)*Math.cos(c*t); const x=Math.cos(a*t)*Math.sin(c*t)-Math.sin(a*t)*Math.cos(c*t)*Math.cos((d-b)*t); return (Math.atan2(y,x)/t+360)%360; }
const DIR=["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];
const dirName = b => DIR[Math.round(b/22.5)%16];
const fmtD = m => m>=1000 ? (m/1000).toFixed(2)+" km" : Math.round(m)+" m";
const nm = m => (m/1852).toFixed(2)+" 海里";

/* ---------- GPS ---------- */
let me=null, meMk=null, meAcc=null, follow=false, sel=null, navLine=null;
const gpsEl=document.getElementById("gps");
if("geolocation" in navigator){
  navigator.geolocation.watchPosition(p=>{
    me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,spd:p.coords.speed,hdg:p.coords.heading};
    const ll=[me.lat,me.lng];
    if(!meMk){ meMk=L.marker(ll,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18]}),zIndexOffset:1000}).addTo(map); meAcc=L.circle(ll,{radius:me.acc,weight:1,fillOpacity:.08}).addTo(map); }
    else { meMk.setLatLng(ll); meAcc.setLatLng(ll).setRadius(me.acc); }
    const kt = me.spd!=null ? (me.spd*1.94384).toFixed(1)+" ﾉｯﾄ" : "";
    gpsEl.innerHTML=`<b>${me.lat.toFixed(5)}, ${me.lng.toFixed(5)}</b><br>誤差 ${Math.round(me.acc)}m ${kt}`;
    if(follow) map.setView(ll,Math.max(map.getZoom(),14));
    // 入力画面 (form) を開いている間は描き直さない (GPS の更新で入力が消えないように)
    updateNav(); if(tab==="points" && !sheet.classList.contains("closed") && !body.querySelector("form")) render();
  },err=>{ gpsEl.textContent="GPS: "+(err.code===1?"位置の使用が許可されていません":"取れません"); },{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
} else gpsEl.textContent="GPS: この端末では使えません";
/* 起点: 現在地 (GPS) か 母港 (和気漁港)。◎ を押すたびに 現在地 → 現在地を追う → 和気漁港 → 現在地… */
// 和気港 = 自分の船 (ﾀｲﾑﾗｲﾝで出港前に止まっていた場所)。前の仮座標のままなら置き換える
if(!S.port || (Math.abs(S.port.lat-33.8975)<1e-4 && Math.abs(S.port.lng-132.7235)<1e-4)) S.port={lat:33.9026,lng:132.7345,name:"和気港"};
// 知っている港: 出港地の名前をこちらで出す
if(!S.marina) S.marina={lat:33.9361,lng:132.7630,name:"ｱﾝｶﾚｯｼﾞﾏﾘｰﾅ"};
// 港の一覧: 本人が決めた位置 (at) と、Google が「立ち寄り」で記録した場所 (alias) の両方で見分け、本人の位置へ寄せる
const KNOWN_PORTS=[
  {name:"和気港 (自分の船)",short:"和気港",at:()=>S.port,alias:[{lat:33.9026,lng:132.7345}]},
  {name:"ｱﾝｶﾚｯｼﾞﾏﾘｰﾅ (友人の船)",short:"ﾏﾘｰﾅ",at:()=>S.marina,alias:[{lat:33.9361,lng:132.7630}]}];
function nearPort(p,m){
  if(!p) return null;
  for(const k of KNOWN_PORTS){ for(const q of [k.at(),...k.alias]){ if(distM(p.lat,p.lng,q.lat,q.lng)<m) return k; } }
  return null;
}
function portLabel(p,short){
  if(!p) return "";
  const k=nearPort(p,800); if(k) return short?k.short:k.name;
  return short?(p.name||"").replace("松山市",""):(p.name||"");
}
const marinaMk=L.marker([S.marina.lat,S.marina.lng],{icon:L.divIcon({className:"",html:'<div style="font-size:36px;line-height:36px;filter:drop-shadow(0 0 2px #fff)">🚩</div>',iconSize:[36,36],iconAnchor:[8,34]}),zIndexOffset:400}).addTo(map).bindTooltip("ｱﾝｶﾚｯｼﾞﾏﾘｰﾅ (友人の船)");
const portMk=L.marker([S.port.lat,S.port.lng],{icon:L.divIcon({className:"",html:'<div style="font-size:44px;line-height:44px;filter:drop-shadow(0 0 2px #fff)">⚓</div>',iconSize:[44,44],iconAnchor:[22,22]}),zIndexOffset:500}).addTo(map).bindTooltip(S.port.name);
function origin(){ return S.base==="port" ? S.port : me; }
const followBtn=document.getElementById("followBtn");
function showBaseBtn(){
  followBtn.classList.toggle("on", follow || S.base==="port");
  followBtn.textContent = S.base==="port" ? "⚓" : "◎";
  followBtn.title = S.base==="port" ? "起点: "+S.port.name : (follow ? "現在地を追っています" : "現在地へ");
}
followBtn.onclick=()=>{
  if(S.base!=="port" && !follow){ follow=true; setWake(true); if(me) map.setView([me.lat,me.lng],Math.max(map.getZoom(),14)); toast("現在地を起点にして追います (画面は消えません)"); }
  else if(S.base!=="port" && follow){ follow=false; setWake(false); S.base="port"; map.setView([S.port.lat,S.port.lng],Math.max(map.getZoom(),13)); toast("起点を "+S.port.name+" にしました"); }
  else { S.base="gps"; follow=false; setWake(false); if(me) map.setView([me.lat,me.lng],Math.max(map.getZoom(),13)); toast("起点を現在地に戻しました"); }
  save(); showBaseBtn(); updateNav(); render();
};
showBaseBtn();
document.getElementById("addHereBtn").onclick=()=>{ if(!me){ toast("まだ現在地が取れていません"); return; } openPointForm(null,me.lat,me.lng); };

/* 案内の帯は 1 回だけ作り、中の文字だけ書き換える (GPS の更新中でも × が押せるように) */
const navBox=document.getElementById("navbox");
navBox.innerHTML=`<span id="nvName"></span><span class="big" id="nvDist"></span><span id="nvDir"></span><button type="button" id="nvClose" aria-label="案内をやめる">×</button>`;
document.getElementById("nvClose").addEventListener("click",e=>{ e.stopPropagation(); selectPoint(null); });
function updateNav(){
  if(navLine){ map.removeLayer(navLine); navLine=null; }
  const p=S.points.find(x=>x.id===sel);
  if(!p){ navBox.hidden=true; return; }
  navBox.hidden=false;
  const o=origin();
  document.getElementById("nvName").textContent=(S.base==="port"?"⚓から ":"")+p.name;
  if(!o){ document.getElementById("nvDist").textContent=""; document.getElementById("nvDir").textContent="現在地待ち"; return; }
  const d=distM(o.lat,o.lng,p.lat,p.lng), b=bearing(o.lat,o.lng,p.lat,p.lng);
  navLine=L.polyline([[o.lat,o.lng],[p.lat,p.lng]],{color:"#d53f8c",weight:3,dashArray:"6 6"}).addTo(map);
  let eta=""; if(S.base!=="port" && me.spd && me.spd>0.5){ eta=" 約"+Math.round(d/me.spd/60)+"分"; }
  document.getElementById("nvDist").textContent=fmtD(d);
  document.getElementById("nvDir").innerHTML=`${Math.round(b)}° ${dirName(b)}<br><small>${nm(d)}${eta}</small>`;
}

/* ---------- ﾎﾟｲﾝﾄ ---------- */
let markers={}, fishFilter=null;
function fishOf(p){ const s=new Set(p.fish||[]); S.logs.filter(l=>l.pid===p.id).forEach(l=>l.fish&&s.add(l.fish)); return [...s]; }
function drawMarkers(){
  Object.values(markers).forEach(m=>map.removeLayer(m)); markers={};
  S.points.forEach(p=>{

/* ---------- 潮 ---------- */
let TIDE=null, tideDay=new Date();
// 潮位の地点 (気象庁)。最初は地図の真ん中に近い地点を選ぶ。潮の画面で切り替えられる
const TIDE_ST=[{id:"MT",name:"松山",lat:33.867,lng:132.717},{id:"NI",name:"新居浜",lat:33.967,lng:133.267},{id:"L8",name:"伊予三島 (土居・川之江)",lat:33.983,lng:133.55}];
const TIDE_CACHE={};
let tideSt=S.tideSt||(()=>{ const c=map.getCenter(); return TIDE_ST.reduce((a,b)=>distM(c.lat,c.lng,a.lat,a.lng)<distM(c.lat,c.lng,b.lat,b.lng)?a:b).id; })();
function loadTide(id){
  tideSt=id; TIDE=TIDE_CACHE[id]||null; if(tab==="tide") render();
  if(TIDE) return;
  fetch(`tide_${id}.json`).then(r=>r.json()).then(j=>{ TIDE_CACHE[id]=j; if(tideSt===id){ TIDE=j; if(tab==="tide") render(); } }).catch(()=>{});
}
// loadTide(tideSt) は画面の準備が済んでから (いちばん下) で呼ぶ
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function moonAge(d){ const ref=Date.UTC(2000,0,6,18,14); const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTime(); return (((t-ref)/86400000)%29.530588853+29.530588853)%29.530588853; }
function tideName(d){
  const day=Math.floor(moonAge(d))+1; // 旧暦の日の目安
  const T={1:"大潮",2:"大潮",3:"大潮",4:"中潮",5:"中潮",6:"中潮",7:"小潮",8:"小潮",9:"小潮",10:"長潮",11:"若潮",12:"中潮",13:"中潮",14:"大潮",15:"大潮",16:"大潮",17:"大潮",18:"大潮",19:"中潮",20:"中潮",21:"中潮",22:"小潮",23:"小潮",24:"小潮",25:"長潮",26:"若潮",27:"中潮",28:"中潮",29:"中潮",30:"大潮"};
  return T[Math.min(day,30)];
}
function tideAt(date){ // 毎時値を補間 (cm)
  if(!TIDE) return null; const k=TIDE[ymd(date)]; if(!k) return null;
  const h=date.getHours()+date.getMinutes()/60; const i=Math.floor(h);
  const a=k.h[i], b = i<23 ? k.h[i+1] : (TIDE[ymd(new Date(date.getTime()+86400000))]||k).h[0];
  return a+(b-a)*(h-i);
}
function tideSVG(k,isToday){
  const W=340,H=150,pl=28,pr=6,pt=10,pb=20;
  const vals=k.h, mn=Math.min(...vals,0), mx=Math.max(...vals,350);
  const x=h=>pl+(W-pl-pr)*h/24, y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let d=""; vals.forEach((v,i)=>{ d+=(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); });
  let grid="";
  for(let h=0;h<=24;h+=6) grid+=`<line x1="${x(h)}" x2="${x(h)}" y1="${pt}" y2="${H-pb}" stroke="var(--line)"/><text x="${x(h)}" y="${H-6}" text-anchor="middle">${h}時</text>`;
  for(let v=0;v<=mx;v+=100) grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${pl-3}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
  let now="";
  if(isToday){ const n=new Date(); const hh=n.getHours()+n.getMinutes()/60; const tv=tideAt(n); if(tv!=null) now=`<line x1="${x(hh)}" x2="${x(hh)}" y1="${pt}" y2="${H-pb}" stroke="var(--accent)" stroke-width="2"/><circle cx="${x(hh)}" cy="${y(tv)}" r="5" fill="var(--accent)"/>`; }
  const ev=(arr,c)=>arr.map(([t,v])=>{ const hh=+t.slice(0,2)+(+t.slice(2))/60; return `<circle cx="${x(hh)}" cy="${y(v)}" r="3" fill="${c}"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="潮位ｸﾞﾗﾌ">${grid}<path d="${d}" fill="none" stroke="var(--hi)" stroke-width="2.2"/>${ev(k.hi,"var(--hi)")}${ev(k.lo,"var(--lo)")}${now}</svg>`;
}
function tideTrend(){
  const n=new Date(), a=tideAt(n), b=tideAt(new Date(n.getTime()+20*60000));
  if(a==null||b==null) return "";
  const k=TIDE[ymd(n)]; const evs=[...k.hi.map(e=>[e[0],"満潮"]),...k.lo.map(e=>[e[0],"干潮"])].map(([t,nm])=>[+t.slice(0,2)*60+(+t.slice(2)),nm]).sort((p,q)=>p[0]-q[0]);
  const m=n.getHours()*60+n.getMinutes(); const nx=evs.find(e=>e[0]>m);
  let s=`今 ${Math.round(a)}cm・${b>a?"上げ潮":"下げ潮"}`;
  if(nx){ const r=nx[0]-m; s+=`／次の${nx[1]}まで ${Math.floor(r/60)}時間${r%60}分`; }
  return s;
}

/* ---------- 船 (給油・燃費・整備) ---------- */
if(!S.fuel) S.fuel=[]; if(!S.maint) S.maint=[];

if(!S.plan) S.plan=[
  {item:"ｴﾝｼﾞﾝｵｲﾙ",h:100,m:12},{item:"ｵｲﾙﾌｨﾙﾀｰ",h:200,m:24},{item:"ｷﾞｱｵｲﾙ",h:100,m:12},
  {item:"燃料ﾌｨﾙﾀｰ",h:200,m:24},{item:"ｽﾊﾟｰｸﾌﾟﾗｸﾞ",h:200,m:24},{item:"ｲﾝﾍﾟﾗ",h:300,m:36},
  {item:"ｱﾉｰﾄﾞ点検",h:0,m:6}];
const today=()=>ymd(new Date());
const num=v=>{ const n=parseFloat(String(v).replace(/[,，]/g,"")); return isNaN(n)?null:n; };
function curHours(){ return Math.max(0,...S.fuel.map(f=>num(f.hours)||0),...S.maint.map(m=>num(m.hours)||0)); }
function fuelStats(){
  const fs=[...S.fuel].filter(f=>num(f.hours)!=null&&num(f.liters)!=null).sort((a,b)=>num(a.hours)-num(b.hours));
  const legs=[]; let last=null, acc=0;
  fs.forEach(f=>{ if(last){ acc+=num(f.liters); if(f.full){ const dh=num(f.hours)-num(last.hours); if(dh>0) legs.push({from:last,to:f,l:acc,h:dh,lph:acc/dh}); last=f; acc=0; } } else if(f.full){ last=f; acc=0; } });
  const tl=legs.reduce((s,x)=>s+x.l,0), th=legs.reduce((s,x)=>s+x.h,0);
  const ys=new Date().getFullYear()+"";
  const yen=S.fuel.filter(f=>(f.date||"").startsWith(ys)).reduce((s,f)=>s+(num(f.yen)||0),0);
  const lit=S.fuel.filter(f=>(f.date||"").startsWith(ys)).reduce((s,f)=>s+(num(f.liters)||0),0);
  return {legs, avg: th?tl/th:null, yen, lit};
}
function planStatus(p){
  const done=S.maint.filter(m=>m.item===p.item).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const lastM=done[done.length-1]; const H=curHours();
  if(!lastM) return {last:null, txt:"記録なし", lvl:"none"};
  let lvl="ok", parts=[];
  if(p.h){ const left=(num(lastM.hours)||0)+p.h-H; parts.push(left>=0?`あと ${Math.round(left)} 時間`:`${Math.round(-left)} 時間 過ぎ`); if(left<0) lvl="over"; else if(left<=10) lvl="soon"; }
  if(p.m){ const d=new Date(lastM.date); d.setMonth(d.getMonth()+p.m); const left=Math.round((d-new Date())/86400000); parts.push(left>=0?`あと ${left} 日`:`${-left} 日 過ぎ`); if(left<0) lvl="over"; else if(left<=30 && lvl!=="over") lvl="soon"; }
  return {last:lastM, txt:parts.join("・"), lvl};
}

/* 航跡: 日ごとにｵﾝ/ｵﾌして重ねて出す。線を押すとその日の情報 */
const tripLayers={};   // date -> layerGroup
const TRIP_COLORS=["#d4145a","#7c3aed","#ea580c","#0f766e","#be123c","#4d7c0f","#c026d3","#b45309"];
function tripColor(date){ const i=[...(S.trips||[])].sort((a,b)=>a.date.localeCompare(b.date)).findIndex(x=>x.date===date); return TRIP_COLORS[(i<0?0:i)%TRIP_COLORS.length]; }
function tripArea(t){
  const sea=t.path.filter(p=>p[3]!==0); if(!sea.length) return "";
  const lng=sea.reduce((s,p)=>s+p[1],0)/sea.length;
  return lng<133.0?"松山沖":lng<133.4?"新居浜・西条沖":lng<133.65?"四国中央沖":"香川沖";
}
// 出港・帰港は 本人が直した名前 (depFix/retFix) があればそれを出す
function depText(t,short){ return t.depFix || (t.dep?portLabel(t.dep,short):"不明"); }
function retText(t,short){ return t.retFix || (t.ret?portLabel(t.ret,short):"不明"); }
function tripInfoHtml(t){
  return `<b>🚤 ${esc(t.date)}</b>　${esc(tripArea(t))}${t.memo?`<br><b>${esc(t.memo)}</b>`:""}<br>海の上 ${esc(t.start)}〜${esc(t.end)}　約 ${t.km} km<br>出港 ${t.dep?esc(t.dep.time):""} ${esc(depText(t))}<br>帰港 ${t.ret?esc(t.ret.time):""} ${esc(retText(t))}<br><button class="btn" style="margin-top:6px;padding:4px 10px" onclick="openTripForm('${t.date}')">直す</button> <button class="btn" style="margin-top:6px;padding:4px 10px" onclick="onlyTrip('${t.date}')">この航路だけ表示</button> <button class="btn" style="margin-top:6px;padding:4px 10px" onclick="toggleTrip('${t.date}',false)">この航路を消す</button>`;

// 出港・帰港を港の位置に寄せる: 直した名前が和気港/ﾏﾘｰﾅならその港、
// 自動の点が港から 1.5km 以内ならその港。寄せられない時は記録の点のまま
function snapPort(fix,p){
  const f=fix||"";
  if(/和気/.test(f)) return [S.port.lat,S.port.lng];
  if(/ﾏﾘｰﾅ|マリーナ|ｱﾝｶﾚｯｼﾞ|アンカレッジ/.test(f)) return [S.marina.lat,S.marina.lng];
  if(f && f!=="不明") return null;
  const k=nearPort(p,1500); if(!k) return null;
  return [k.at().lat,k.at().lng];
}
function drawTrip(t){
  const c=tripColor(t.date);
  let sea=t.path.filter(p=>p[3]!==0);
  const i0=t.path.indexOf(sea[0]), i1=t.path.lastIndexOf(sea[sea.length-1]);
  const sd=snapPort(t.depFix,t.dep), sr=snapPort(t.retFix,t.ret);
  // 港に寄せた時は、港から 2km 以内の海の点 (港を出入りする所の粗い点) を飛ばして、
  // 港 → 沖の点 へまっすぐつなぐ (港の近くで線が折れ曲がらないように)
  if(sd){ while(sea.length>2 && distM(sea[0][0],sea[0][1],sd[0],sd[1])<2000) sea=sea.slice(1); }
  if(sr){ while(sea.length>2 && distM(sea[sea.length-1][0],sea[sea.length-1][1],sr[0],sr[1])<2000) sea=sea.slice(0,-1); }
  // さらに、港とつないだ所で 90 度より急に折り返す点 (行って戻る形) を、出入り各 3 点まで飛ばす
  const back=(a,b,c)=>((b[0]-a[0])*(c[0]-b[0])+(b[1]-a[1])*Math.cos(b[0]*Math.PI/180)**2*(c[1]-b[1]))<0;
  if(sd){ for(let k=0;k<3 && sea.length>2 && back(sd,sea[0],sea[1]);k++) sea=sea.slice(1); }
  if(sr){ for(let k=0;k<3 && sea.length>2 && back(sea[sea.length-2],sea[sea.length-1],sr);k++) sea=sea.slice(0,-1); }
  // 港に寄せた時は 港→海→港、寄せられない時は記録の陸の点 (点線) もつなぐ
  // 印: 0=陸の点 1=海の点 2=寄せた港
  const pts=[...(sd?[[sd[0],sd[1],t.dep?t.dep.time:"",2]]:t.path.slice(0,i0)), ...sea, ...(sr?[[sr[0],sr[1],t.ret?t.ret.time:"",2]]:t.path.slice(i1+1))];
  const n=pts.length;
  // 海の上 (港からの線も) は太い実線、陸の上 (港までの道) は点線
  const parts=[];
  for(let i=0;i<n-1;i++){ const a=pts[i], b=pts[i+1]; const land=(a[3]===0||b[3]===0);
    parts.push(L.polyline([[a[0],a[1]],[b[0],b[1]]],land?{color:c,weight:3,opacity:.8,dashArray:"4 6"}:{color:c,weight:4,opacity:1})); }
  const casing=L.polyline(pts.filter(p=>p[3]!==0).map(p=>[p[0],p[1]]),{color:"#ffffff",weight:8,opacity:.95});
  const pins=[];
  const dp=sd||(t.dep?[t.dep.lat,t.dep.lng]:null), rp=sr||(t.ret?[t.ret.lat,t.ret.lng]:null);
  if(dp) pins.push(L.circleMarker(dp,{radius:8,color:"#fff",weight:2,fillColor:"#16a34a",fillOpacity:1}).bindTooltip(`出港 ${t.dep?t.dep.time:""} ${depText(t)}`));
  if(rp) pins.push(L.circleMarker(rp,{radius:8,color:"#fff",weight:2,fillColor:"#dc2626",fillOpacity:1}).bindTooltip(`帰港 ${t.ret?t.ret.time:""} ${retText(t)}`));
  t={...t,path:pts};
  const g=L.layerGroup([casing,...parts,
    ...t.path.filter(p=>p[3]!==2).map(p=>L.circleMarker([p[0],p[1]],{radius:p[3]===0?3:4,color:"#ffffff",weight:1.5,fillColor:c,fillOpacity:1}).bindTooltip(`${t.date.slice(5)} ${p[2]}`)),...pins]);
  g.eachLayer(l=>l.on("click",e=>{ L.popup().setLatLng(e.latlng).setContent(tripInfoHtml(t)).openOn(map); showArrows(pts,c); }));
  return g;
}
window.toggleTrip=function(date,on){
  const t=(S.trips||[]).find(x=>x.date===date); if(!t) return;
  const shown=!!tripLayers[date]; if(on===undefined) on=!shown;
  if(on && !shown){ tripLayers[date]=drawTrip(t).addTo(map); }
  if(!on && shown){ map.removeLayer(tripLayers[date]); delete tripLayers[date]; map.closePopup(); clearArrows(); }
  if(tab==="trips" && !sheet.classList.contains("closed")) render();
};
/* 選んだ航路に進む向きの矢印 (線を押した時だけ。吹き出しを閉じると消える) */
let arrowLayer=null;
function clearArrows(){ if(arrowLayer){ map.removeLayer(arrowLayer); arrowLayer=null; } }
function showArrows(pts,c){

    const a=pts[i], b=pts[i+1]; if(distM(a[0],a[1],b[0],b[1])<400) continue;

  }

}

/* 海釣図V の「ﾊﾞｯｸｱｯﾌﾟ」zip (mypoints.json) */
const FISH_WORDS=["カワハギ","ハマチ","ブリ","メジロ","サワラ","イサキ","アジ","サバ","タコ","イカ","メバル","カサゴ","ガシラ","アコウ","キス","チヌ","クロダイ","マダイ","タイ","ヒラメ","カレイ","タチウオ","スズキ","シーバス","サゴシ"];
function fishFromName(n){
  const s=n.normalize("NFKC"); const r=[];
  FISH_WORDS.forEach(w=>{ if(s.includes(w) && !r.some(x=>x.includes(w)||w.includes(x))) r.push(w); });
  return r;
}
function importKaichouzu(j){
  let add=0;
  j.points.forEach(p=>{ const lat=+p.lat, lng=+p.lon; if(isNaN(lat)||isNaN(lng)) return;
    if(S.points.some(x=>Math.abs(x.lat-lat)<1e-6&&Math.abs(x.lng-lng)<1e-6)) return;
    const d=p.r_date?new Date(p.r_date*1000):null;
    const name=(p.point_name||"海釣図Vのﾎﾟｲﾝﾄ").normalize("NFKC");
    S.points.push({id:uid(),name,lat,lng,depth:"",fish:fishFromName(name),memo:[p.memo||"",d?`海釣図V 登録 ${ymd(d)}`:""].filter(Boolean).join("\n")}); add++; });
  save(); drawMarkers();
  if(S.points.length) map.fitBounds(L.latLngBounds(S.points.map(p=>[p.lat,p.lng])),{padding:[40,40]});
  toast(`海釣図V から ${add} 件追加しました`); render();
}
async function importFile(f){
  if(/\.zip$/i.test(f.name)){
    try{ const z=await JSZip.loadAsync(f); const mp=z.file("mypoints.json"); if(!mp) throw 0; importKaichouzu(JSON.parse(await mp.async("string"))); }
    catch(e){ toast("この zip は読めませんでした (海釣図V のﾊﾞｯｸｱｯﾌﾟを選んでください)"); }
    return;
  }
  const r=new FileReader(); r.onload=()=>importText(f.name,r.result); r.readAsText(f);
}
function importText(name,txt){
  if(/\.json$/i.test(name)){ try{ const j=JSON.parse(txt);
      if(Array.isArray(j.trips)){ if(!S.trips) S.trips=[]; let add=0, upd=0;
        j.trips.forEach(t=>{ const i=S.trips.findIndex(x=>x.date===t.date);
          if(i<0){ S.trips.push(t); add++; }
          else { const o=S.trips[i]; ["depFix","retFix","memo"].forEach(k=>{ if(o[k]!==undefined && t[k]===undefined) t[k]=o[k]; }); S.trips[i]=t; upd++; } });
        Object.keys(tripLayers).forEach(d=>toggleTrip(d,false));
        save(); toast(`出船記録: ${add} 日分 追加・${upd} 日分 更新しました`); setTab("trips"); return; }
      if(Array.isArray(j.semanticSegments)){ toast("ﾀｲﾑﾗｲﾝの元ﾌｧｲﾙは大きすぎるので、PC で海の上だけ取り出した ﾌｧｲﾙを読み込んでください"); return; }
      if(!Array.isArray(j.points)) throw 0;
      if(j.points.length && j.points[0].point_name!==undefined){ importKaichouzu(j); return; }
      let add=0; j.points.forEach(p=>{ if(!S.points.some(x=>x.id===p.id)){ S.points.push(p); add++; } }); (j.logs||[]).forEach(l=>{ if(!S.logs.some(x=>x.id===l.id)) S.logs.push(l); });
      (j.fuel||[]).forEach(l=>{ if(!S.fuel.some(x=>x.id===l.id)) S.fuel.push(l); });
      (j.maint||[]).forEach(l=>{ if(!S.maint.some(x=>x.id===l.id)) S.maint.push(l); });
      save(); drawMarkers(); toast(`控えから ${add} 件追加しました`); render(); }catch(e){ toast("この JSON は読めませんでした"); } return; }
  const doc=new DOMParser().parseFromString(txt,"application/xml");
  if(doc.querySelector("parsererror")){ toast("GPX として読めませんでした"); return; }
  let add=0;
  doc.querySelectorAll("wpt").forEach(w=>{ const lat=+w.getAttribute("lat"), lng=+w.getAttribute("lon"); if(isNaN(lat)||isNaN(lng)) return;
    if(S.points.some(p=>Math.abs(p.lat-lat)<1e-6&&Math.abs(p.lng-lng)<1e-6)) return;
    const n=(w.querySelector("name")||{}).textContent||"読込ﾎﾟｲﾝﾄ"; const ds=((w.querySelector("desc")||w.querySelector("cmt")||{}).textContent)||"";
    S.points.push({id:uid(),name:n.trim(),lat,lng,depth:"",fish:[],memo:ds.trim()}); add++; });
  let pts=0;
  doc.querySelectorAll("trkseg, rte").forEach(seg=>{ const ll=[...seg.querySelectorAll("trkpt, rtept")].map(p=>[+p.getAttribute("lat"),+p.getAttribute("lon")]).filter(a=>!isNaN(a[0])); if(ll.length>1){ const t=L.polyline(ll,{color:"#2b6cb0",weight:3,opacity:.8}).addTo(map); trackLayers.push(t); pts+=ll.length; } });
  save(); drawMarkers();
  if(trackLayers.length) map.fitBounds(L.featureGroup(trackLayers).getBounds(),{padding:[30,30]});
  toast(`ﾎﾟｲﾝﾄ ${add} 件追加・航跡 ${pts} 点を表示`); render();
}
function toGpx(){
  const x=s=>String(s).replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="matsuyama-fishmap" xmlns="http://www.topografix.com/GPX/1/1">\n`+
    S.points.map(p=>`<wpt lat="${p.lat}" lon="${p.lng}"><name>${x(p.name)}</name><desc>${x([fishOf(p).join("・"),p.depth?p.depth+"m":"",p.memo].filter(Boolean).join(" / "))}</desc></wpt>`).join("\n")+`\n</gpx>\n`;
}
function dl(name,txt,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000); }

    }
  }
  h+=`<div class="row" style="margin-top:8px"><button class="btn" id="copyLink">ｱﾌﾟﾘのﾘﾝｸをｺﾋﾟｰ</button><span class="note" style="user-select:all;word-break:break-all">${esc(link)}</span></div>`;
  return h;
}
function renderShareBox(){ const b=document.getElementById("shareBox"); if(!b) return; b.innerHTML=shareHtml(); shareBind(); }
function shareBind(){
  const g=document.getElementById("gbtn");
  if(g && gisReady){ try{ google.accounts.id.renderButton(g,{theme:"outline",size:"large",text:"signin_with",locale:"ja"}); }catch(e){} }
  const sy=document.getElementById("syncBtn"); if(sy) sy.onclick=()=>syncNow(true);
  const lo=document.getElementById("logoutBtn"); if(lo) lo.onclick=()=>{ SH.tok=null; SH.exp=0; SH.state=""; try{ localStorage.removeItem("fm_tok"); google.accounts.id.disableAutoSelect(); }catch(e){} renderShareBox(); toast("ﾛｸﾞｱｳﾄしました (このｽﾏﾎの記録は残ります)"); };
  const ms=document.getElementById("memSave"); if(ms) ms.onclick=()=>{ api("setMembers",{members:val("memIn")}).then(r=>{ if(r.ok){ SH.members=r.members; toast("共有する人を保存しました"); renderShareBox(); } else toast("保存できませんでした: "+r.err); }).catch(()=>toast("つながりません")); };
  const cl=document.getElementById("copyLink"); if(cl) cl.onclick=()=>{ const t=location.origin+location.pathname; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("ﾘﾝｸをｺﾋﾟｰしました")).catch(()=>toast(t)); };
}
let syncTimer=null;
function scheduleSync(){ if(!tokOk()||SH.busy) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(),1500); }
async function syncNow(manual){
  if(!tokOk()){ if(manual) toast("ﾛｸﾞｲﾝし直してください"); if(gisReady && SH.email) google.accounts.id.prompt(); return; }
  if(SH.busy) return; SH.busy=true;
  try{
    const r=await api("list");
    if(!r.ok){ SH.state=r.err==="notmember"?"notmember":"err"; SH.msg=r.err||""; return; }
    SH.state="ok"; SH.owner=!!r.owner; if(r.members) SH.members=r.members;
    if(!S.snap) S.snap={points:{},logs:{}};
    let up=0, down=0;
    for(const kind of ["points","logs"]){
      const local=S[kind], snap=S.snap[kind], srv={}; r[kind].forEach(o=>srv[o.id]=o);
      const lmap={}; local.forEach(o=>lmap[o.id]=o);
      const adds=[], puts=[], dels=[];
      // このｽﾏﾎの変更 → 共有へ
      local.forEach(o=>{ const b=body_(o); if(!(o.id in snap)){ if(!srv[o.id]) adds.push(o); } else if(snap[o.id]!==b) puts.push(o); });
      Object.keys(snap).forEach(id=>{ if(!lmap[id] && srv[id]) dels.push(id); });
      // 共有の変更 → このｽﾏﾎへ (このｽﾏﾎで変えた物はこちらを優先)
      const changedHere=new Set([...adds,...puts].map(o=>o.id).concat(dels));
      let next=local.filter(o=>!((o.id in snap) && !srv[o.id] && !changedHere.has(o.id)));  // 他で消された
      Object.values(srv).forEach(o=>{
        if(changedHere.has(o.id)) return;
        const i=next.findIndex(x=>x.id===o.id);
        if(i<0){ next.push(o); down++; }
        else if(body_(next[i])!==body_(o) || next[i].by!==o.by || next[i].updAt!==o.updAt){ next[i]=o; down++; }
      });
      if(adds.length){ const rr=await api("putMany",{kind,items:adds.map(o=>Object.assign({},o,{by:o.by||SH.email}))}); if(!rr.ok) throw new Error(rr.err); up+=adds.length; }
      for(const o of puts){ const rr=await api("put",{kind,item:o}); if(!rr.ok) throw new Error(rr.err); up++; }
      for(const id of dels){ const rr=await api("del",{kind,id}); if(!rr.ok) throw new Error(rr.err); up++; }
      next.forEach(o=>{ if(!o.by) o.by=SH.email; });
      S[kind]=next;
      const ns={}; next.forEach(o=>ns[o.id]=body_(o)); S.snap[kind]=ns;
    }
    SH.last=new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
    SH.msg=(up||down)?`送った ${up} 件・受け取った ${down} 件`:"変わりなし";
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    drawMarkers(); if(tab!=="data" && !body.querySelector("form")) render();
    if(manual||up||down) toast("同期しました: "+SH.msg);
  }catch(e){ SH.state="err"; SH.msg=String(e.message||e); if(manual) toast("同期できませんでした"); }
  finally{ SH.busy=false; if(tab==="data") renderShareBox(); }
}
setInterval(()=>{ if(document.visibilityState==="visible") syncNow(); },180000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") syncNow(); });

/* ---------- その他 ---------- */
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let tt; function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,2500); }
/* 画面の点けっぱなしは「◎ 現在地を追う」の間だけ (電池のため) */
let wake=null;
async function setWake(on){
  try{ if(on && !wake && navigator.wakeLock){ wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{ wake=null; }); }
       if(!on && wake){ await wake.release(); wake=null; } }catch(e){}
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && follow) setWake(true); });
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
window.setTab=setTab;
drawMarkers(); render(); depthHint(); loadTide(tideSt); if(tokOk()) syncNow();
setInterval(()=>{ if(tab==="tide") render(); },60000);
